[project]
name = "agentic-sdlc-governance-engine"
version = "1.0.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 130
extend-exclude = ["app/simulation/sandbox_template"]

[tool.ruff.lint.per-file-ignores]
"app/simulation/code_templates.py" = ["E501"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
